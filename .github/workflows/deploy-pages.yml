name: Deploy Nauru and JSAP dashboards to Pages

on:
  push:
    branches: [main]
    paths:
      - nauru-dashboard/**
      - jsap-dashboard/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble site (Nauru dashboard at root, JSAP dashboard at /jsap/)
        run: |
          mkdir -p _site
          cp -r nauru-dashboard/. _site/
          mkdir -p _site/jsap
          cp jsap-dashboard/index.html _site/jsap/index.html
      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
